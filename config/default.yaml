# Anthos default configuration
# Override any value via CLI: --config config/default.yaml --key value

model:
  dim: 2048
  n_layers: 28
  vocab_size: 131072
  max_seq_len: 32768
  rope_base: 500000.0
  norm_eps: 1.0e-6
  bias: false
  tie_embeddings: true

  # Floating MoE Attention
  n_attn_heads: 32
  attn_top_k: 6
  head_dim: 64

  # MoE FFN
  expert_dim: 1024
  n_routed_experts: 60
  n_shared_experts: 4
  ffn_top_k: 8

  # Aux loss
  z_loss_coeff: 1.0e-3
  bal_loss_coeff: 1.0e-2

tokenizer:
  model_path: data/anthos_tokenizer

train:
  batch_size: 32
  grad_accum_steps: 4
  max_steps: 500000
  warmup_steps: 2000
  learning_rate: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  grad_clip: 1.0
  save_every: 1000
  log_every: 10
  dtype: bfloat16
  seed: 42

inference:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1
